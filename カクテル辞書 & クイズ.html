<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>カクテル辞書 & クイズ</title>
<style>
:root{
  --bg:#fbf7f2; --card:#ffffff; --ink:#2b2320; --sub:#7a6d63; --line:#e6ddd2;
  --accent:#a8452f; --accent2:#c9793f; --chip:#f1e6d8;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1c1714; --card:#26201c; --ink:#f1e8de; --sub:#b6a998; --line:#3a322b;
    --accent:#e08a5c; --accent2:#e0b25c; --chip:#332a23;
  }
}
:root[data-theme="dark"]{
  --bg:#1c1714; --card:#26201c; --ink:#f1e8de; --sub:#b6a998; --line:#3a322b;
  --accent:#e08a5c; --accent2:#e0b25c; --chip:#332a23;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hiragino Sans","Yu Gothic",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
header{padding:20px 16px 12px;text-align:center}
h1{font-size:1.35rem;margin:0 0 4px;letter-spacing:.02em}
header p{margin:0;color:var(--sub);font-size:.85rem}
nav{display:flex;gap:8px;justify-content:center;padding:8px 16px 0;flex-wrap:wrap;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
nav button{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 14px;border-radius:999px;font-size:.9rem;cursor:pointer}
nav button.active{background:var(--accent);color:#fff;border-color:var(--accent)}
main{max-width:760px;margin:0 auto;padding:16px}
.view{display:none}
.view.active{display:block}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.filters button{border:1px solid var(--line);background:var(--chip);color:var(--ink);padding:5px 11px;border-radius:8px;font-size:.8rem;cursor:pointer}
.filters button.active{background:var(--accent2);color:#231a12;border-color:var(--accent2)}
.search{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:.9rem;margin-bottom:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.card .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.card h3{margin:0;font-size:1rem}
.card .price{color:var(--accent);font-weight:600;font-size:.9rem;white-space:nowrap}
.tag{display:inline-block;font-size:.7rem;color:var(--sub);border:1px solid var(--line);border-radius:6px;padding:1px 6px;margin:4px 6px 0 0}
.ing{margin-top:6px;font-size:.85rem;color:var(--sub)}
.fam-group{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:12px}
.fam-group h4{margin:0 0 6px;font-size:.9rem;color:var(--accent)}
.fam-group .members{display:flex;flex-wrap:wrap;gap:6px}
.fam-group .m{background:var(--chip);border-radius:8px;padding:6px 9px;font-size:.85rem}
.fam-group .m b{color:var(--ink)}
.fam-group .m span{color:var(--sub);font-size:.75rem;display:block}
.origin-card{background:var(--chip);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:14px}
.origin-card h4{margin:0 0 6px;font-size:.95rem;color:var(--accent)}
.origin-card p{margin:4px 0;font-size:.85rem;color:var(--ink);line-height:1.5}
.origin-card p b{color:var(--accent2)}
.qcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;text-align:center}
.qcard .qtext{font-size:1.05rem;margin-bottom:16px;line-height:1.5}
.choices{display:grid;gap:10px}
.choices button{padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--chip);color:var(--ink);font-size:.95rem;cursor:pointer}
.choices button.correct{background:#3f7d4a;color:#fff;border-color:#3f7d4a}
.choices button.wrong{background:var(--accent);color:#fff;border-color:var(--accent)}
.qmeta{display:flex;justify-content:space-between;color:var(--sub);font-size:.8rem;margin-bottom:10px}
.next{margin-top:16px;padding:10px 20px;border-radius:999px;border:none;background:var(--accent);color:#fff;font-size:.9rem;cursor:pointer;display:none}
.empty{color:var(--sub);text-align:center;padding:30px 0}
</style>
</head>
<body>
<header>
<h1>🍸 カクテル辞書 & クイズ</h1>
<p>メニュー掲載カクテルをベース別・材料別に整理</p>
</header>
<nav>
<button class="tabbtn active" data-v="dict">辞書</button>
<button class="tabbtn" data-v="fam">材料が同じ仲間</button>
<button class="tabbtn" data-v="quiz">クイズ</button>
</nav>
<main>

<section id="dict" class="view active">
  <input class="search" id="search" placeholder="カクテル名・材料で検索">
  <div class="filters" id="baseFilters"></div>
  <div id="dictList"></div>
</section>

<section id="fam" class="view">
  <p style="color:var(--sub);font-size:.85rem;margin-top:0">ベースの酒（ラム・ジン等）を除いた材料が完全に一致するカクテルをグループ化しています。</p>
  <div id="famList"></div>
</section>

<section id="quiz" class="view">
  <div id="modeSelect">
    <p style="color:var(--sub);font-size:.85rem;margin-top:0">出題形式を選んでください</p>
    <div class="filters" id="modeButtons"></div>
  </div>
  <div class="qcard" id="qcard" style="display:none">
    <div class="qmeta"><span id="qscore">0 / 0 正解</span><span id="qtype"></span></div>
    <div class="qtext" id="qtext"></div>
    <div class="choices" id="qchoices"></div>
    <button class="next" id="qnext">次の問題 →</button>
    <button class="next" id="qchangemode" style="display:inline-block;background:var(--chip);color:var(--ink);border:1px solid var(--line);margin-left:8px">モード変更</button>
  </div>
</section>

</main>

];

const ORIGIN={
"ラム":{origin:"17世紀、カリブ海の英領バルバドスなどでサトウキビから砂糖を精製する際に出る副産物「糖蜜」を発酵・蒸留したのが始まりとされる。",etym:"名前の由来は諸説あり、当時の水夫言葉で「大騒ぎ・興奮」を意味した『rumbullion(ラムバリオン)』の略という説や、ラテン語で砂糖を意味する『saccharum』に由来するという説がある。"},
"ジン":{origin:"17世紀のオランダで、薬用酒(利尿・解熱)として開発されたのが起源。オランダ人医師フランシスクス・シルヴィウスが考案したという説が広く知られる。",etym:"名前はオランダ語で『ねずの実』を意味する『jenever(ジュネヴァ)』に由来し、これがフランス経由で英語に取り込まれる際に『gin』と短縮された。"},
"ウォッカ":{origin:"8〜9世紀頃の東欧(現在のロシア・ポーランド周辺)で穀物やじゃがいもを原料に作られ始めたとされる蒸留酒。",etym:"名前はスラブ語で『水』を意味する『voda』に、指小辞(小さい・親愛)を付けた『vodka＝小さな水』という意味からきている。"},
"テキーラ":{origin:"16世紀にスペイン人がメキシコへ蒸留技術を伝えたことで発展した、アガベ(リュウゼツラン)を原料とする蒸留酒。メキシコ政府の原産地呼称制度により特定地域でしか名乗れない。",etym:"名前はメキシコ・ハリスコ州にある町『テキーラ』の地名に由来する。地名自体はナワトル語で『切る場所』などを意味するという説がある。"},
"ウイスキー":{origin:"中世スコットランド・アイルランドの修道院で培われた蒸留技術から発展したとされる穀物由来の蒸留酒。",etym:"名前はゲール語で『命の水』を意味する『uisce beatha(ウィシュケ・バーハ)』が英語風に訛って『whisky』となった。"},
"ブランデー":{origin:"16〜17世紀、オランダの商人がワインを長距離輸送しやすくするため蒸留して濃縮したのが始まりとされる。",etym:"名前はオランダ語で『焼いたワイン』を意味する『brandewijn』に由来し、これが英語で『brandy』となった。"},
};

function famKey(ings){return ings.filter(i=>!STRIP.has(i)).sort().join("+")}

// ---- dict view ----
let activeBase="all";
const bf=document.getElementById("baseFilters");
["all",...BASES].forEach(b=>{
  const btn=document.createElement("button");
  btn.textContent=b==="all"?"すべて":b;
  btn.className=b==="all"?"active":"";
  btn.onclick=()=>{activeBase=b;[...bf.children].forEach(c=>c.classList.remove("active"));btn.classList.add("active");renderDict()};
  bf.appendChild(btn);
});
document.getElementById("search").addEventListener("input",renderDict);

function renderDict(){
  const q=document.getElementById("search").value.trim();
  const list=document.getElementById("dictList");
  list.innerHTML="";
  if(activeBase!=="all"&&ORIGIN[activeBase]){
    const o=ORIGIN[activeBase];
    const oc=document.createElement("div");oc.className="origin-card";
    oc.innerHTML=`<h4>📜 ${activeBase}の由来</h4><p><b>起源:</b> ${o.origin}</p><p><b>名前の語源:</b> ${o.etym}</p>`;
    list.appendChild(oc);
  }
  const items=DATA.filter(d=>(activeBase==="all"||d[1]===activeBase)&&(!q||d[0].includes(q)||d[3].some(i=>i.includes(q))));
  if(!items.length){list.innerHTML+='<div class="empty">該当するカクテルがありません</div>';return}
  items.forEach(([name,base,type,ings,price,etym])=>{
    const el=document.createElement("div");el.className="card";
    el.innerHTML=`<div class="top"><h3>${name}</h3><span class="price">${price?"¥"+price:"価格不明"}</span></div>
    <span class="tag">${base}</span><span class="tag">${type}</span>
    <div class="ing">${ings.join("、")}</div>
    <div class="ing" style="margin-top:6px"><b style="color:var(--accent2)">語源:</b> ${etym}</div>`;
    list.appendChild(el);
  });
}
renderDict();

// ---- family view ----
function renderFamilies(){
  const groups={};
  DATA.forEach(d=>{const k=famKey(d[3]);if(!k)return;(groups[k]=groups[k]||[]).push(d)});
  const list=document.getElementById("famList");
  list.innerHTML="";
  const keys=Object.keys(groups).filter(k=>groups[k].length>1);
  if(!keys.length){list.innerHTML='<div class="empty">グループなし</div>';return}
  keys.forEach(k=>{
    const members=groups[k];
    const el=document.createElement("div");el.className="fam-group";
    el.innerHTML=`<h4>共通材料: ${k.split("+").join("、")}</h4>
    <div class="members">${members.map(m=>`<div class="m"><b>${m[0]}</b><span>${m[1]}・${m[3].filter(i=>STRIP.has(i)).join("/")||"（ベースのみ）"}</span></div>`).join("")}</div>`;
    list.appendChild(el);
  });
}
renderFamilies();

// ---- tabs ----
document.querySelectorAll(".tabbtn").forEach(b=>{
  b.onclick=()=>{
    document.querySelectorAll(".tabbtn").forEach(x=>x.classList.remove("active"));
    b.classList.add("active");
    document.querySelectorAll(".view").forEach(v=>v.classList.remove("active"));
    document.getElementById(b.dataset.v).classList.add("active");
  };
});

// ---- quiz ----
let score=0,total=0,current=null,currentMode="random";
function shuffle(a){return a.map(v=>[Math.random(),v]).sort((x,y)=>x[0]-y[0]).map(v=>v[1])}
function pick(n,arr,exclude){const pool=arr.filter(x=>x!==exclude);return shuffle(pool).slice(0,n)}

const MODES=[
  {key:"ing2name",label:"素材 → カクテル"},
  {key:"name2ing",label:"カクテル → 素材"},
  {key:"base2name",label:"お酒 → カクテル"},
  {key:"name2base",label:"カクテル → お酒"},
  {key:"origin2base",label:"お酒の由来・語源 → お酒"},
  {key:"etym2name",label:"カクテル名の語源 → カクテル"},
  {key:"random",label:"ランダム（混合）"},
];
const TYPE_LABEL={ing2name:"素材→カクテル",name2ing:"カクテル→素材",base2name:"お酒→カクテル",name2base:"カクテル→お酒",origin2base:"お酒の由来・語源→お酒",etym2name:"カクテル名の語源→カクテル"};
const modeBtns=document.getElementById("modeButtons");
MODES.forEach(m=>{
  const b=document.createElement("button");
  b.textContent=m.label;
  b.onclick=()=>startQuiz(m.key);
  modeBtns.appendChild(b);
});
function startQuiz(mode){
  currentMode=mode;score=0;total=0;
  document.getElementById("qscore").textContent="0 / 0 正解";
  document.getElementById("modeSelect").style.display="none";
  document.getElementById("qcard").style.display="block";
  newQuestion();
}
document.getElementById("qchangemode").onclick=()=>{
  document.getElementById("modeSelect").style.display="block";
  document.getElementById("qcard").style.display="none";
};

function newQuestion(){
  const pool=["ing2name","name2ing","base2name","name2base","origin2base","etym2name"];
  const type=currentMode==="random"?pool[Math.floor(Math.random()*pool.length)]:currentMode;
  const d=DATA[Math.floor(Math.random()*DATA.length)];
  const [name,base,,ings,,etym]=d;
  let qtext,correct,choices;
  if(type==="ing2name"){
    qtext=`次の材料で作るカクテルは？\n「${ings.join("、")}」`;
    correct=name;
    choices=shuffle([name,...pick(3,DATA.map(x=>x[0]),name)]);
  } else if(type==="name2ing"){
    const wrongIngsSets=pick(3,DATA,d).map(x=>x[3].join("、"));
    qtext=`「${name}」の材料はどれ？`;
    correct=ings.join("、");
    choices=shuffle([correct,...wrongIngsSets]);
  } else if(type==="base2name"){
    qtext=`「${base}」がベースのカクテルはどれ？`;
    correct=name;
    const others=pick(20,DATA,d).filter(x=>x[1]!==base).slice(0,3);
    choices=shuffle([name,...others.map(x=>x[0])]);
  } else if(type==="origin2base"){
    const rb=BASES[Math.floor(Math.random()*BASES.length)];
    const useEtym=Math.random()<0.5;
    const text=useEtym?ORIGIN[rb].etym:ORIGIN[rb].origin;
    qtext=`次の${useEtym?"名前の語源":"起源"}の説明はどのお酒？\n「${text}」`;
    correct=rb;
    choices=shuffle([rb,...pick(3,BASES,rb)]);
  } else if(type==="etym2name"){
    qtext=`次はどのカクテルの名前の語源？\n「${etym}」`;
    correct=name;
    choices=shuffle([name,...pick(3,DATA.map(x=>x[0]),name)]);
  } else {
    qtext=`「${name}」のベースのお酒はどれ？`;
    correct=base;
    choices=shuffle([base,...pick(3,BASES,base)]);
  }
  current={correct};
  document.getElementById("qtype").textContent=TYPE_LABEL[type];
  document.getElementById("qtext").textContent=qtext;
  const cc=document.getElementById("qchoices");
  cc.innerHTML="";
  choices.forEach(c=>{
    const btn=document.createElement("button");
    btn.textContent=c;
    btn.onclick=()=>answer(btn,c);
    cc.appendChild(btn);
  });
  document.getElementById("qnext").style.display="none";
}
function answer(btn,choice){
  [...document.getElementById("qchoices").children].forEach(b=>b.disabled=true);
  total++;
  if(choice===current.correct){score++;btn.classList.add("correct")}
  else{
    btn.classList.add("wrong");
    [...document.getElementById("qchoices").children].forEach(b=>{if(b.textContent===current.correct)b.classList.add("correct")});
  }
  document.getElementById("qscore").textContent=`${score} / ${total} 正解`;
  document.getElementById("qnext").style.display="inline-block";
}
document.getElementById("qnext").onclick=newQuestion;
</script>
</body>
</html>
